# doom: DOOM on two boards (apps/doom). Two pods:
#
#   doom-sim    control plane (PSRAM): the game and its BSP pass, run in place
#               from the flash blob doom-sim with the IWAD cut to one map in the
#               blob doom-wad; publishes a frame's draw list on doom.draw at
#               DOOM_FPS, takes keys from doom.keys. With DOOM_PLAYERS=2 it
#               orders two players' ticcmds (port/net.c): a browser joins as
#               player 2 at http://<control-plane-ip>/doom/ (the page, its
#               engine and IWAD from the blob doom-web), ticcmds go out on
#               doom.tics as an Ingress event stream and come back by POST
#   doom-view   Cardputer: draws the draw lists with the raster kernels from
#               the render pack blob doom-pack, keys from its keyboard
#
# The modules and the data are blobs on the nodes; the wordsketch pods are here
# at 0 replicas, so this one apply switches the boards from wordsketch to DOOM
# and apps/wordsketch/build/wordsketch.yaml switches them back:
#   make -C apps/doom pods manifest   # modules, packs, build/doom.yaml (needs apps/wordsketch/build)
#   make -C apps/doom upload SERVER=http://<control-plane-ip>:6443 DEVKIT=<devkit node> CARDPUTER=<cardputer node>
#   kubectl --context kube32 apply -f apps/doom/build/doom.yaml
#   curl -s http://<control-plane-ip>/doom/stats
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doom-sim
  namespace: default
  labels: {app: doom, tier: sim}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: doom, tier: sim}
  template:
    metadata:
      labels: {app: doom, tier: sim}
      annotations:
        kube32.io/blobs: doom-wad,doom-web
        kube32.io/event-topics: doom.keys
        kube32.io/tick-interval: "50ms"
        kube32.io/execution-budget: "off"
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: sim
          image: wasm://blob/doom-sim
          ports: [{name: http, containerPort: 7000}]
          env:
            - {name: DOOM_IWAD, value: "doom1.wad"}            # the IWAD the engine identifies the game by
            - {name: DOOM_WAD_BLOB, value: "doom-wad"}         # the sim pack (wad.py simpack)
            - {name: DOOM_ARGS, value: "-warp 1 1 -skill 3 -kb 224"}
            - {name: DOOM_SCREENBLOCKS, value: "11"}           # the whole 240 x 135 screen
            - {name: DOOM_FPS, value: "8"}
            - {name: DOOM_PLAYERS, value: "2"}                 # a browser may join as player 2
            - {name: DOOM_WEB_BLOB, value: "doom-web"}         # the page for it (wad.py web)
            - {name: DOOM_NET_TOPIC, value: "doom.tics"}
          resources:
            requests: {memory: 640Ki, esp32.io/psram: 640Ki, hardware.kube32.io/ipc: "1"}
            limits: {memory: 640Ki, esp32.io/psram: 640Ki}
          securityContext:
            capabilities: {add: ["CHANNEL_IPC"]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doom-view
  namespace: default
  labels: {app: doom, tier: view}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: doom, tier: view}
  template:
    metadata:
      labels: {app: doom, tier: view}
      annotations:
        kube32.io/blobs: doom-pack
        kube32.io/event-topics: doom.draw
        kube32.io/tick-interval: "50ms"
        kube32.io/execution-budget: "off"
    spec:
      nodeSelector:
        kube32.io/board: cardputer
      containers:
        - name: view
          image: wasm://blob/doom-view
          ports: [{name: http, containerPort: 7000}]
          env:
            - {name: DOOM_PACK_BLOB, value: "doom-pack"}       # the render pack (wad.py pack)
            - {name: DOOM_KEYS_TOPIC, value: "doom.keys"}
          resources:
            requests:
              memory: 32Ki
              hardware.kube32.io/tft-display: "1"
              hardware.kube32.io/keyboard: "1"
              hardware.kube32.io/ipc: "1"
            limits: {memory: 32Ki}
          securityContext:
            capabilities: {add: ["DISPLAY", "KEYBOARD", "CHANNEL_IPC"]}
---
apiVersion: v1
kind: Service
metadata: {name: doom-sim, namespace: default}
spec:
  selector: {app: doom, tier: sim}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: doom-view, namespace: default}
spec:
  selector: {app: doom, tier: view}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doom
  namespace: default
  annotations:
    kube32.io/event-stream: "/doom/events=doom.tics"
spec:
  rules:
    - http:
        paths:
          - path: /doom
            pathType: Prefix
            backend:
              service:
                name: doom-sim
                port: {number: 80}
          - path: /doom-view
            pathType: Prefix
            backend:
              service:
                name: doom-view
                port: {number: 80}
# ---- the wordsketch pods, scaled to 0 while DOOM has the boards ----
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordsketch-listen
  namespace: default
  labels: {app: wordsketch, tier: listen}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: wordsketch, tier: listen}
  template:
    metadata:
      labels: {app: wordsketch, tier: listen}
      annotations:
        kube32.io/wasm-base64: "@wordsketch-listen.wasm"
        kube32.io/blobs: wordsketch-kws
        kube32.io/event-topics: wordsketch.frame,wordsketch.text
        kube32.io/tick-interval: "50ms"
        kube32.io/execution-budget: "off"
    spec:
      nodeSelector:
        kube32.io/board: cardputer
      containers:
        - name: listen
          image: wasm://inline/wordsketch-listen
          ports: [{name: http, containerPort: 7000}]
          env:
            - {name: STORY_URL, value: "http://wordsketch-teller/generate"}
            - {name: STORY_STEPS, value: "80"}
            - {name: STEPS, value: "8"}            # DDIM steps of the drawing: 8 or 16
            - {name: THRESHOLD, value: "60"}       # percent a keyword needs
            - {name: VOLUME, value: "30"}          # chime, percent of the speaker's ceiling
          resources:
            requests:
              memory: 20Ki
              hardware.kube32.io/microphone: "1"
              hardware.kube32.io/speaker: "1"
              hardware.kube32.io/tft-display: "1"
              hardware.kube32.io/ipc: "1"
            limits: {memory: 20Ki}
          securityContext:
            capabilities: {add: ["MICROPHONE", "SPEAKER", "DISPLAY", "CHANNEL_IPC", "SERVICE_CALL"]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordsketch-draw
  namespace: default
  labels: {app: wordsketch, tier: draw}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: wordsketch, tier: draw}
  template:
    metadata:
      labels: {app: wordsketch, tier: draw}
      annotations:
        kube32.io/wasm-base64: "@wordsketch-draw.wasm"
        kube32.io/blobs: wordsketch-doodle
        kube32.io/event-topics: wordsketch.word
        kube32.io/tick-interval: "100ms"
        kube32.io/execution-budget: "off"
    spec:
      containers:
        - name: draw
          image: wasm://inline/wordsketch-draw
          env:
            - {name: GUIDANCE, value: "20"}       # classifier-free guidance in tenths
          resources:
            # PSRAM places it: a node with room for the drawing's maps
            requests: {memory: 192Ki, esp32.io/psram: 192Ki, hardware.kube32.io/ipc: "1"}
            limits: {memory: 192Ki, esp32.io/psram: 192Ki}
          securityContext:
            capabilities: {add: ["CHANNEL_IPC"]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordsketch-story
  namespace: default
  labels: {app: wordsketch, tier: story}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: wordsketch, tier: story}
  template:
    metadata:
      labels: {app: wordsketch, tier: story}
      annotations:
        kube32.io/wasm-base64: "@llm-shard.wasm"
        kube32.io/blobs: wordsketch-story
        kube32.io/wasm-stack: "1536"
        kube32.io/execution-budget: "off"
        kube32.io/tick-interval: "100ms"
    spec:
      containers:
        - name: shard
          image: wasm://inline/llm-shard
          ports: [{name: http, containerPort: 7000}]
          env:
            - {name: STAGE, value: "0"}
            - {name: MODEL_BLOB, value: "wordsketch-story"}   # read in place
            - {name: NEXT_URL, value: "http://wordsketch-teller/result"}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            # norms and token scales, a KV cache of 110 positions; the
            # 327 KB model stays in its blob
            requests: {memory: 64Ki, esp32.io/psram: 64Ki}
            limits: {memory: 64Ki, esp32.io/psram: 64Ki}
          securityContext:
            capabilities: {add: ["SERVICE_CALL"]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordsketch-teller
  namespace: default
  labels: {app: wordsketch, tier: teller}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: wordsketch, tier: teller}
  template:
    metadata:
      labels: {app: wordsketch, tier: teller}
      annotations:
        kube32.io/wasm-base64: "@llm-coordinator.wasm"
        kube32.io/tick-interval: "100ms"
    spec:
      containers:
        - name: teller
          image: wasm://inline/llm-coordinator
          ports: [{name: http, containerPort: 7000}]
          env:
            - {name: SHARD_URL, value: "http://wordsketch-story/x"}
            - {name: STORE_URL, value: "http://wordsketch-store"}
            - {name: TOKENIZER, value: "wordsketch-tokenizer"}
            - {name: TOPIC, value: "wordsketch.text"}
            - {name: CONTEXT, value: "128"}
            - {name: STEPS, value: "80"}
            - {name: PROMPT, value: ""}
          resources:
            requests: {memory: 64Ki, esp32.io/psram: 64Ki, hardware.kube32.io/ipc: "1"}
            limits: {memory: 64Ki, esp32.io/psram: 64Ki}
          securityContext:
            capabilities: {add: ["SERVICE_CALL", "CHANNEL_IPC"]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordsketch-store
  namespace: default
  labels: {app: wordsketch, tier: store}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: wordsketch, tier: store}
  template:
    metadata:
      labels: {app: wordsketch, tier: store}
      annotations:
        kube32.io/wasm-base64: "@wordsketch-store.wasm"
        kube32.io/wasm-stack: "512"
        kube32.io/blobs: wordsketch-tokenizer
    spec:
      containers:
        - name: store
          image: wasm://inline/wordsketch-store
          ports: [{name: http, containerPort: 7000}]
          resources:
            requests: {memory: 8Ki, esp32.io/psram: 8Ki}
            limits: {memory: 8Ki, esp32.io/psram: 8Ki}
# ---- llm-diffusion (examples/llm-diffusion.yaml), scaled to 0 while DOOM has the boards ----
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-diffusion
  namespace: default
  labels:
    app: llm-diffusion
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: llm-diffusion
  template:
    metadata:
      labels:
        app: llm-diffusion
      annotations:
        kube32.io/wasm-base64: "@llm-diffusion.wasm"
        kube32.io/blobs: mdlm
        kube32.io/execution-budget: "off"
        kube32.io/wasm-stack: "1536"
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      restartPolicy: Always
      containers:
        - name: llm-diffusion
          image: wasm://inline/llm-diffusion
          ports:
            - containerPort: 7000
              name: http
          resources:
            requests:
              memory: 256Ki
            limits:
              memory: 256Ki
