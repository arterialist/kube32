# A pod no node can take: it asks the control plane for 4000Ki of heap memory and
# 4Mi of PSRAM, more than either board has (the simulator's PSRAM stand-in is
# 1284Ki). The scheduler leaves it Pending and records a FailedScheduling
# event that counts each node's reason:
#
#   kubectl apply -f examples/oversized-pod.yaml
#   kubectl get events --field-selector involvedObject.name=oversized-pod
#
# The image is the small echo pod embedded in the firmware; it is never pulled
# because the pod is never bound to a node.
apiVersion: v1
kind: Pod
metadata:
  name: oversized-pod
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  containers:
    - name: greedy-worker
      image: wasm://embedded/echo:v1
      resources:
        requests:
          memory: 4000Ki
          esp32.io/psram: 4Mi
