apiVersion: v1
kind: Pod
metadata:
  name: gpio-blinker
  namespace: default
  labels:
    app: blinker
    environment: edge
spec:
  nodeSelector:
    kubernetes.io/arch: xtensa
  containers:
    - name: blinker-task
      image: wasm://embedded/blinker:v1
      resources:
        limits:
          memory: 32Ki
          cpu: 50m
        requests:
          memory: 16Ki
          hardware.kube32.io/gpio: "1"
      securityContext:
        capabilities:
          add:
            - GPIO_WRITE
