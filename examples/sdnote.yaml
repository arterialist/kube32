# sdnote: a pod that keeps a file on the Cardputer's microSD card.
#
# The image is NOT embedded in the firmware: it is pulled from the card at
# /sd/kube32/images/sdnote.wasm. Build it with `make -C apps/sdnote` and put
# it on the node's card over the network:
#   tools/kube32-cli sd-push images/sd/sdnote.wasm --node <cardputer node>
#
# The pod requests the card (hardware.kube32.io/sd) and names its volume
# claim: every k32_fs_* path is relative to /sd/kube32/volumes/notes/.
# On start it appends a line to boot.log; GET /log serves the file.
#
#   kubectl --context kube32 apply -f examples/sdnote.yaml
#   kubectl --context kube32 get events --field-selector involvedObject.name=sdnote
#   kubectl --context kube32 logs sdnote       (sdnote: appended to boot.log, bytes=...)
#
# GET /log is answered by the node's pod HTTP server (port 7000, header
# X-Kube32-Pod: default/sdnote); the file itself can be read through the API
# server too:
#   kubectl get --raw /api/v1/nodes/<node>/proxy/storage/volumes/notes/boot.log
apiVersion: v1
kind: Pod
metadata:
  name: sdnote
  namespace: default
  labels:
    app: sdnote
spec:
  nodeSelector:
    kube32.io/board: cardputer
  restartPolicy: Always
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: notes            # -> /sd/kube32/volumes/notes/ (kube32.io/sd: {claim: notes} is accepted too)
  containers:
    - name: sdnote
      image: wasm://sd/sdnote
      resources:
        requests:
          memory: 16Ki
          hardware.kube32.io/sd: "1"
        limits:
          memory: 16Ki
