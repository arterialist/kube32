apiVersion: batch/v1
kind: Job
metadata:
  name: zero-trust-tamper-auth
  namespace: default
  labels:
    app: secure-enclave-auth
    tier: physical-security
    execution: ephemeral-micro-job
spec:
  ttlSecondsAfterFinished: 5
  template:
    metadata:
      labels:
        app: secure-enclave-auth
    spec:
      nodeName: esp32-node-01
      restartPolicy: Never
      containers:
        - name: hmac-authenticator
          image: wasm://security/hmac-sha256-latch:v1
          resources:
            limits:
              memory: 24Ki
            requests:
              memory: 12Ki
              hardware.kube32.io/gpio: "5" # Solenoid physical lock relay
          env:
            - name: EXECUTION_MODE
              value: "ephemeral-cold-boot"
            - name: AUTO_TEARDOWN_MS
              value: "50"
