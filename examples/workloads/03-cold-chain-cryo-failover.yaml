apiVersion: v1
kind: Pod
metadata:
  name: cold-chain-cryo-supervisor
  namespace: default
  labels:
    app: vaccine-cryo-controller
    tier: medical-life-safety
    reliability.kube32.io/priority: "critical"
spec:
  nodeName: esp32-node-02
  restartPolicy: Always
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["vaccine-cryo-controller"]
          topologyKey: "kubernetes.io/hostname"
  containers:
    - name: compressor-pid-regulator
      image: wasm://medical/cryo-pid-governor:v1
      resources:
        limits:
          memory: 32Ki
        requests:
          memory: 16Ki
          hardware.kube32.io/gpio: "2" # Compressor actuation solenoid pin
      livenessProbe:
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 2
      env:
        - name: TARGET_TEMP_MILLICELSIUS
          value: "-80000"
        - name: HYSTERESIS_MILLICELSIUS
          value: "500"
