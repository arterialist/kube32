apiVersion: v1
kind: Pod
metadata:
  name: cloud-edge-synapse-telemetry
  namespace: kube32-cluster
  labels:
    app: 3tier-synapse
    tier: industrial-iot-hybrid
    network.kube32.io/ingress: reverse-tunnel-mesh
spec:
  nodeName: esp32-node-02
  restartPolicy: Always
  containers:
    - name: edge-synapse-worker
      image: wasm://telemetry/protobuf-streamer:v2
      resources:
        limits:
          memory: 48Ki
        requests:
          memory: 24Ki
          hardware.kube32.io/adc: "0" # Physical sensor channel
      env:
        - name: UPSTREAM_ROUTER
          value: "pi-edge-gateway:6443"
        - name: CLOUD_TOPOLOGY_SYNC
          value: "orbstack.local:26443"
        - name: COMPRESSION_LEVEL
          value: "fast-lz"
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-edge-synapse-service
  namespace: kube32-cluster
  labels:
    app: 3tier-synapse
spec:
  type: ClusterIP
  ports:
    - name: protobuf-stream
      port: 9090
      protocol: TCP
      targetPort: 9090
  selector:
    app: 3tier-synapse
