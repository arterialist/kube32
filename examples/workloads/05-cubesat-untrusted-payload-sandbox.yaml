apiVersion: v1
kind: Pod
metadata:
  name: cubesat-payload-sandbox
  namespace: default
  labels:
    app: orbital-payload-experiment
    mission: cubesat-science
    security.kube32.io/sandbox: gas-metered
spec:
  nodeName: esp32-node-01
  restartPolicy: Never
  containers:
    - name: experimental-attitude-tracker
      image: wasm://payload/attitude-estimator:v3-untrusted
      resources:
        limits:
          memory: 32Ki
          cpu: "500m"
          hardware.kube32.io/gas-limit: "2500000" # Hard ceiling on Wasm3 instructions
        requests:
          memory: 16Ki
      env:
        - name: ALGORITHM_TYPE
          value: "non-linear-gradient-descent"
        - name: MAX_ITERATIONS
          value: "100000" # Potentially infinite without gas cutoff
