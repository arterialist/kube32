apiVersion: v1
kind: Pod
metadata:
  name: seismic-bridge-flight-recorder
  namespace: default
  labels:
    app: infrastructure-blackbox
    tier: structural-health
spec:
  nodeName: esp32-node-02
  nodeSelector:
    hardware.kube32.io/psram: "true"
  restartPolicy: Always
  containers:
    - name: ring-buffer-recorder
      image: wasm://structural/psram-blackbox:v1
      resources:
        limits:
          memory: 1536Ki # Allocates 1.5 MB ring buffer in external Quad-SPI PSRAM
        requests:
          memory: 1024Ki
          hardware.kube32.io/psram: "1"
          hardware.kube32.io/adc: "1" # High-rate piezo accelerometer channel
      env:
        - name: BUFFER_DEPTH_SAMPLES
          value: "30000" # 30 seconds at 1000 Hz continuous pre-trigger
        - name: TRIGGER_G_FORCE
          value: "2.5"
