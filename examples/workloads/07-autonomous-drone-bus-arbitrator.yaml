apiVersion: v1
kind: Pod
metadata:
  name: drone-flight-controller-fusion
  namespace: kube32-cluster
  labels:
    app: drone-avionics
    tier: flight-control
    hardware.kube32.io/bus-lock: "exclusive"
spec:
  nodeName: esp32-node-01
  restartPolicy: Always
  containers:
    - name: ekf-quaternion-filter
      image: wasm://avionics/ekf-imu-fusion:v2
      resources:
        limits:
          memory: 40Ki
        requests:
          memory: 24Ki
          hardware.kube32.io/i2c: "0" # Exclusive lock on I2C port 0 (6-axis IMU)
          hardware.kube32.io/spi: "1" # Fast logging bus for micro-telemetry
      env:
        - name: FUSION_RATE_HZ
          value: "200"
        - name: COMPASS_DECLINATION_DEG
          value: "-12.4"
