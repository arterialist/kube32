site_name: Kube32
site_description: Embedded Kubernetes Control Plane & WebAssembly Runtime for ESP32-S3 Microcontrollers
site_url: https://arterialist.github.io/kube32/
repo_name: arterialist/kube32
repo_url: https://github.com/arterialist/kube32
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

extra_css:
  - stylesheets/blueprint.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js

nav:
  - Overview: index.md
  - Getting started:
      - Quickstart guide: quickstart.md
      - Hardware specifications: hardware-spec.md
      - Flashing and troubleshooting: flashing-troubleshooting.md
  - Architecture:
      - System architecture: architecture/index.md
      - Radix state store: architecture/radix-store.md
      - Autonomous scheduler: architecture/scheduler.md
      - Wasm3 runtime sandbox: architecture/wasm-runtime.md
      - Capability firewall: architecture/capability-firewall.md
      - Virtual channel IPC: architecture/espnow-ipc.md
  - Workloads and tutorials:
      - GPIO peripheral firewall: workloads/gpio-blinker.md
      - Distributed TinyML pipeline: workloads/distributed-pipeline.md
      - Resource limits and OOM handling: workloads/resource-limits.md
  - Reference:
      - CLI reference: cli-reference.md
      - Kubernetes API matrix: api-reference.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

strict: true
