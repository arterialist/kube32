site_name: Kube32
site_description: Kubernetes-compatible control plane and WebAssembly runtime for the ESP32-S3
site_url: https://arterialist.github.io/kube32/
repo_name: arterialist/kube32
repo_url: https://github.com/arterialist/kube32
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

extra_css:
  - stylesheets/blueprint.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js

nav:
  - Overview: index.md
  - Getting started:
      - Quick start: quickstart.md
      - Hardware: hardware-spec.md
      - Flashing and the serial console: flashing-troubleshooting.md
  - Building apps:
      - Writing app pods: app-development.md
      - microSD card: sd-card.md
      - GPIO and other peripherals: workloads/gpio-blinker.md
      - Tessera demo: tessera.md
  - Architecture:
      - Overview: architecture/index.md
      - Object store: architecture/radix-store.md
      - Scheduler and controllers: architecture/scheduler.md
      - Wasm runtime: architecture/wasm-runtime.md
      - Capability firewall: architecture/capability-firewall.md
      - Events between nodes: architecture/espnow-ipc.md
  - Reference:
      - Kubernetes API coverage: api-reference.md
      - Tools: cli-reference.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

strict: true
