; ==============================================================================
; Kube32 - PlatformIO Project Configuration for ESP32-S3 Microcontrollers
; ==============================================================================
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600

; Target ESP32-S3 clock and bus frequencies
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv

; Compiler and linker flags
build_flags = 
    -std=gnu++17
    -fexceptions
    -DKUBE32_TARGET_ESP32=1
    -Iinclude
    -Ithird_party/wasm3/source
    -Dd_m3CodePageAlignSize=4096
    -Dd_m3HasExceptionHandling=0
    -Dd_m3HasTypedRefs=0
    -Dd_m3HasStackSwitching=0
    -Dd_m3HasSnapshots=0
    -Dd_m3HasGasMetering=1
    -Dd_m3MaxFunctionStackHeight=1024
    -Dd_m3RecordBacktraces=0
    -Dd_m3MaxNativeStack=98304
    -Dd_m3NativeStackMargin=6144
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-format

; Serial monitor filters
monitor_filters = esp32_exception_decoder, time, default
extra_scripts = pre:tools/pio_embed.py
