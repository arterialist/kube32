; ==============================================================================
; Kube32 - PlatformIO Project Configuration for ESP32-S3 Microcontrollers
; ==============================================================================
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600

; Target ESP32-S3 clock and bus frequencies
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv

; Compiler and linker flags
build_flags = 
    -std=gnu++17
    -DKUBE32_TARGET_ESP32=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DCONFIG_ESP32S3_SPIRAM_SUPPORT=1
    -O2
    -Wall
    -Wextra
    -Wno-unused-parameter

; Serial monitor filters
monitor_filters = esp32_exception_decoder, time, default
