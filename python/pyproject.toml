[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "kube32"
dynamic = ["version"]
description = "Command-line tools for kube32: build and deploy WebAssembly pods, flash ESP32-S3 boards, run the kube32-sim simulator"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["kubernetes", "esp32", "esp32-s3", "webassembly", "wasm3", "iot", "kubectl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Clustering",
]
dependencies = [
    "pyserial>=3.5",
    "esptool>=4.7",
]

[project.urls]
Homepage = "https://github.com/arterialist/kube32"
Documentation = "https://arterialist.github.io/kube32/"
Changelog = "https://github.com/arterialist/kube32/blob/main/CHANGELOG.md"
Issues = "https://github.com/arterialist/kube32/issues"

[project.scripts]
kube32 = "kube32.cli:main"
kube32-cli = "kube32.cli:main_cli"

# The version is the release tag, vX.Y.Z; between tags it is a development version
[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true, version_scheme = "guess-next-dev", local_scheme = "node-and-date" }

[tool.hatch.build.targets.wheel]
packages = ["src/kube32"]

[tool.hatch.build.targets.sdist]
include = ["src/kube32", "hatch_build.py", "README.md"]

# Copies the ABI header and the Rust template from the repository (hatch_build.py)
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
