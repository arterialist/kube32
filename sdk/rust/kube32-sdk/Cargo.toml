[package]
name = "kube32-sdk"
version = "0.1.0"
edition = "2021"
description = "no_std Rust bindings for the kube32 WebAssembly pod ABI"
license = "Apache-2.0"
repository = "https://github.com/arterialist/kube32"
homepage = "https://arterialist.github.io/kube32/"
documentation = "https://docs.rs/kube32-sdk"
readme = "README.md"
keywords = ["kube32", "wasm", "esp32", "kubernetes", "no-std"]
categories = ["wasm", "embedded", "no-std", "api-bindings"]

# docs.rs documents the hardware, fs and linalg modules too
[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib"]

[features]
default = ["panic-handler"]
# Defines the #[panic_handler] for wasm32 builds: logs "panic" through k32_log
# and traps. Disable it when the application provides its own.
panic-handler = []
# k32_display_*, k32_key_read, k32_tone and esp32_rmt_* (infrared) wrappers.
# Calls need the matching hardware.kube32.io/* or esp32.io/rmt-* resource in
# the pod manifest.
hardware = []
# k32_fs_* wrappers (pod storage on the microSD card). Calls need
# hardware.kube32.io/sd: "1" and a volume claim in the pod manifest.
fs = []
# k32_matvec_*, k32_matmul_*, k32_vecmat_f32_i8, k32_softmax_f32 and the
# element-wise wrappers (rmsnorm, quantize, rope, swiglu, add, argmax): native
# products for quantized neural networks. They need no manifest resource.
linalg = []
