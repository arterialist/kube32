[workspace]
resolver = "2"
members = ["kube32-sdk", "examples/counter", "examples/notes"]

# Profiles live at the workspace root; cargo ignores them in member crates.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
panic = "abort"
