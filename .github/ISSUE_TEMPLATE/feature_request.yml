name: Feature request
description: Propose a new feature or capability for kube32
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the use case or limitation you want to address.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you want to see, including Kubernetes API resources or CLI behaviour if applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe other approaches or workarounds you considered.
    validations:
      required: false
