name: Publish Python package

# Publishes the kube32 package to PyPI when a GitHub Release is published. The
# package version is the release tag (vX.Y.Z) through hatch-vcs. PyPI accepts
# the upload through trusted publishing: the `pypi` environment of this
# repository and workflow is registered as the project's trusted publisher.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build the sdist and the wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version comes from the release tag
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build
        working-directory: python
        run: uv build --out-dir ../dist
      - name: The package version is the release's
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          test -f "dist/kube32-${version}.tar.gz"
          test -f "dist/kube32-${version}-py3-none-any.whl"
          test "$(uv tool run --from "dist/kube32-${version}-py3-none-any.whl" kube32 version --client)" = "kube32 ${version}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/kube32/
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
